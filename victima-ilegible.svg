<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Una hoja de papel doblada, fundida en latón, con texto ilegible grabado en su superficie, sobre un campo oxblood oscuro: la amenaza que no se puede leer.">
  <defs>
    <radialGradient id="campoVI" cx="50%" cy="42%" r="82%">
      <stop offset="0%" stop-color="#3c161a"/>
      <stop offset="100%" stop-color="#190a0c"/>
    </radialGradient>
    <linearGradient id="latonVI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edc684"/>
      <stop offset="55%" stop-color="#c89a51"/>
      <stop offset="100%" stop-color="#8f6a33"/>
    </linearGradient>
    <linearGradient id="latonVIb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a87c3f"/>
      <stop offset="100%" stop-color="#6f5128"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#campoVI)"/>

  <!-- sombra larga -->
  <ellipse cx="600" cy="500" rx="250" ry="30" fill="#000" opacity="0.4"/>

  <!-- hoja doblada en latón: dos paneles -->
  <polygon points="468,150 600,178 600,488 468,468" fill="url(#latonVIb)" stroke="#6f5128" stroke-width="3"/>
  <polygon points="600,178 742,150 742,468 600,488" fill="url(#latonVI)" stroke="#6f5128" stroke-width="3"/>
  <line x1="600" y1="178" x2="600" y2="488" stroke="#5e4422" stroke-width="4" opacity="0.85"/>

  <!-- texto ilegible: renglones garabateados (panel izquierdo) -->
  <g stroke="#2a0f12" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M498,232 q40,-10 72,4"/>
    <path d="M498,266 q56,8 92,-6"/>
    <path d="M498,300 q40,-8 82,2"/>
    <path d="M498,334 q52,10 86,-4"/>
    <path d="M498,368 q46,-6 70,6"/>
    <path d="M498,402 q50,8 84,-4"/>
  </g>
  <!-- renglones garabateados (panel derecho) -->
  <g stroke="#5e4422" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M632,224 q46,-8 80,4"/>
    <path d="M632,258 q56,10 92,-6"/>
    <path d="M632,292 q40,-6 82,2"/>
    <path d="M632,326 q52,8 86,-4"/>
    <path d="M632,360 q46,-6 72,6"/>
    <path d="M632,394 q50,8 82,-4"/>
  </g>

  <!-- brillo superior -->
  <path d="M472,160 q132,18 264,-8" fill="none" stroke="#f6dca4" stroke-width="4" opacity="0.6"/>
</svg>
