<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Un televisor de latón antiguo cuya pantalla muestra un estadio iluminado, apoyado sobre un suelo agrietado; el espectáculo que cubre la casa.">
  <defs>
    <radialGradient id="campo86" cx="50%" cy="44%" r="78%">
      <stop offset="0%" stop-color="#143a36"/>
      <stop offset="100%" stop-color="#0a201e"/>
    </radialGradient>
    <linearGradient id="laton86" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edc684"/>
      <stop offset="55%" stop-color="#c89a51"/>
      <stop offset="100%" stop-color="#9a7236"/>
    </linearGradient>
    <linearGradient id="latonLado" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5a30"/>
      <stop offset="100%" stop-color="#a87c3f"/>
    </linearGradient>
    <radialGradient id="pantalla" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1d4b45"/>
      <stop offset="100%" stop-color="#081614"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#campo86)"/>

  <!-- suelo agrietado: la casa -->
  <line x1="250" y1="812" x2="1250" y2="812" stroke="#6f5128" stroke-width="5" opacity="0.7"/>
  <polyline points="690,812 712,838 686,866 720,900 700,940" fill="none" stroke="#0a201e" stroke-width="6" opacity="0.85"/>
  <polyline points="690,812 668,840 700,872" fill="none" stroke="#6f5128" stroke-width="3" opacity="0.5"/>

  <!-- sombra del televisor -->
  <ellipse cx="750" cy="806" rx="300" ry="34" fill="#000" opacity="0.34"/>

  <!-- antena -->
  <g stroke="url(#laton86)" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="640" y1="250" x2="560" y2="120"/>
    <line x1="860" y1="250" x2="940" y2="120"/>
  </g>
  <circle cx="556" cy="116" r="14" fill="url(#laton86)"/>
  <circle cx="944" cy="116" r="14" fill="url(#laton86)"/>

  <!-- cuerpo del televisor -->
  <rect x="430" y="250" width="640" height="540" rx="46" fill="url(#laton86)"/>
  <rect x="430" y="250" width="640" height="540" rx="46" fill="none" stroke="#6f5128" stroke-width="4" opacity="0.6"/>

  <!-- bisel de pantalla -->
  <rect x="478" y="300" width="470" height="440" rx="30" fill="#5e4422"/>
  <!-- pantalla -->
  <rect x="498" y="320" width="430" height="400" rx="22" fill="url(#pantalla)"/>

  <!-- estadio dentro de la pantalla -->
  <g opacity="0.95">
    <!-- gradas -->
    <ellipse cx="713" cy="560" rx="180" ry="92" fill="none" stroke="#c9a35a" stroke-width="9" opacity="0.85"/>
    <ellipse cx="713" cy="560" rx="132" ry="66" fill="none" stroke="#c9a35a" stroke-width="6" opacity="0.7"/>
    <!-- cancha -->
    <ellipse cx="713" cy="560" rx="96" ry="46" fill="#16463f"/>
    <ellipse cx="713" cy="560" rx="96" ry="46" fill="none" stroke="#e6c282" stroke-width="2.5" opacity="0.8"/>
    <line x1="713" y1="514" x2="713" y2="606" stroke="#e6c282" stroke-width="2" opacity="0.7"/>
    <circle cx="713" cy="560" r="15" fill="none" stroke="#e6c282" stroke-width="2" opacity="0.7"/>
    <!-- reflectores -->
    <circle cx="566" cy="452" r="6" fill="#ffe9b0"/>
    <circle cx="860" cy="452" r="6" fill="#ffe9b0"/>
    <circle cx="566" cy="668" r="6" fill="#ffe9b0"/>
    <circle cx="860" cy="668" r="6" fill="#ffe9b0"/>
  </g>
  <!-- reflejo de pantalla -->
  <path d="M498,344 q120,-44 240,-6 -130,40 -240,150 z" fill="#ffffff" opacity="0.06"/>

  <!-- controles -->
  <circle cx="1010" cy="360" r="26" fill="url(#latonLado)" stroke="#6f5128" stroke-width="3"/>
  <circle cx="1010" cy="440" r="26" fill="url(#latonLado)" stroke="#6f5128" stroke-width="3"/>
  <rect x="986" y="520" width="48" height="120" rx="10" fill="url(#latonLado)" stroke="#6f5128" stroke-width="3"/>

  <!-- patas -->
  <rect x="510" y="788" width="40" height="26" rx="6" fill="url(#latonLado)"/>
  <rect x="950" y="788" width="40" height="26" rx="6" fill="url(#latonLado)"/>

  <!-- brillo superior -->
  <path d="M476,272 q274,-26 548,0" fill="none" stroke="#f6dca4" stroke-width="5" opacity="0.7"/>
</svg>
