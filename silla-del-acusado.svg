<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Una silla curul de latón sobre fondo verde botella; su sombra se alarga y toma la forma de un mazo de juez.">
  <defs>
    <radialGradient id="bg" cx="38%" cy="36%" r="95%">
      <stop offset="0%" stop-color="#123227"/>
      <stop offset="55%" stop-color="#0c241b"/>
      <stop offset="100%" stop-color="#071711"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9c98a"/>
      <stop offset="45%" stop-color="#c79a4b"/>
      <stop offset="100%" stop-color="#8a6024"/>
    </linearGradient>
    <linearGradient id="brassDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#caa055"/>
      <stop offset="100%" stop-color="#7a5520"/>
    </linearGradient>
    <linearGradient id="shadowFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#03100b" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#03100b" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a4434" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#1a4434" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- haz de luz lateral, muy sutil -->
  <polygon points="0,0 360,0 560,800 0,800" fill="#e9c98a" opacity="0.045"/>

  <!-- resplandor de piso bajo la silla -->
  <ellipse cx="430" cy="640" rx="380" ry="90" fill="url(#floorGlow)"/>

  <!-- SOMBRA: nace en las patas y se vuelve mazo -->
  <g>
    <!-- cuerpo de la sombra (proyección sesgada de la silla) -->
    <polygon points="350,632 540,632 980,716 760,738" fill="url(#shadowFade)"/>
    <!-- mango del mazo -->
    <polygon points="930,712 1085,706 1088,722 935,732" fill="#03100b" opacity=".82"/>
    <!-- cabeza del mazo -->
    <rect x="1062" y="668" width="58" height="92" rx="10" transform="rotate(8 1091 714)" fill="#03100b" opacity=".88"/>
    <!-- anillos de la cabeza -->
    <rect x="1066" y="676" width="50" height="7" rx="3" transform="rotate(8 1091 714)" fill="#0c241b" opacity=".9"/>
    <rect x="1066" y="744" width="50" height="7" rx="3" transform="rotate(8 1091 714)" fill="#0c241b" opacity=".9"/>
  </g>

  <!-- SILLA CURUL DE LATÓN -->
  <g>
    <!-- respaldo: marco -->
    <path d="M352 180 q88 -64 176 0 l-12 18 q-76 -52 -152 0 z" fill="url(#brass)"/>
    <rect x="346" y="190" width="16" height="252" rx="7" fill="url(#brass)"/>
    <rect x="518" y="190" width="16" height="252" rx="7" fill="url(#brassDark)"/>
    <!-- barrotes del respaldo -->
    <rect x="384" y="206" width="9" height="226" rx="4" fill="url(#brassDark)"/>
    <rect x="418" y="200" width="9" height="232" rx="4" fill="url(#brass)"/>
    <rect x="452" y="200" width="9" height="232" rx="4" fill="url(#brassDark)"/>
    <rect x="486" y="206" width="9" height="226" rx="4" fill="url(#brass)"/>
    <!-- remates del respaldo -->
    <circle cx="354" cy="184" r="13" fill="url(#brass)"/>
    <circle cx="526" cy="184" r="13" fill="url(#brassDark)"/>

    <!-- asiento -->
    <path d="M330 440 h222 q16 0 16 16 v16 q0 14 -16 14 h-222 q-16 0 -16 -14 v-16 q0 -16 16 -16 z" fill="url(#brass)"/>
    <rect x="314" y="476" width="254" height="10" rx="5" fill="#8a6024"/>

    <!-- brazos -->
    <path d="M306 360 q-26 4 -22 34 q2 20 24 22 l8 -16 q-12 -2 -12 -16 q0 -14 12 -16 z" fill="url(#brassDark)"/>
    <rect x="300" y="356" width="60" height="12" rx="6" fill="url(#brass)"/>
    <path d="M576 360 q26 4 22 34 q-2 20 -24 22 l-8 -16 q12 -2 12 -16 q0 -14 -12 -16 z" fill="url(#brassDark)"/>
    <rect x="522" y="356" width="60" height="12" rx="6" fill="url(#brassDark)"/>
    <rect x="312" y="368" width="14" height="84" rx="6" fill="url(#brass)"/>
    <rect x="556" y="368" width="14" height="84" rx="6" fill="url(#brassDark)"/>

    <!-- patas -->
    <path d="M338 486 l-6 146 h16 l10 -146 z" fill="url(#brass)"/>
    <path d="M526 486 l10 146 h16 l-6 -146 z" fill="url(#brassDark)"/>
    <path d="M398 486 l-2 120 h13 l5 -120 z" fill="url(#brassDark)" opacity=".92"/>
    <path d="M468 486 l5 120 h13 l-2 -120 z" fill="url(#brass)" opacity=".92"/>
    <!-- travesaño -->
    <rect x="344" y="586" width="196" height="9" rx="4" fill="url(#brassDark)"/>
    <!-- pies -->
    <ellipse cx="340" cy="634" rx="14" ry="6" fill="#8a6024"/>
    <ellipse cx="548" cy="634" rx="14" ry="6" fill="#7a5520"/>
  </g>

  <!-- viñeta -->
  <rect width="1200" height="800" fill="url(#bg)" opacity="0" />
  <rect width="1200" height="800" fill="#03100b" opacity="0.0"/>
</svg>
